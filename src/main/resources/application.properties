spring.application.name=turnoya-backend

# --- Base de datos (PostgreSQL) ---
# Los valores por defecto son para desarrollo local; en producción se usan las variables de entorno.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:turnoya}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT ---
jwt.secret=${JWT_SECRET:turnoya-clave-local-solo-para-desarrollo-cambiar-en-produccion}
jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# --- Administrador inicial (se crea al arrancar si no existe) ---
app.admin.display-name=${ADMIN_NAME:Administrador TurnoYa}
app.admin.email=${ADMIN_EMAIL:admin@turnoya.com}
app.admin.password=${ADMIN_PASSWORD:Admin12345}

# --- CORS (orígenes del frontend separados por coma) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Correo (EmailService) ---
# Configura estas variables de entorno en tu máquina/IntelliJ (Run Configuration > Environment variables),
# NUNCA subas usuario/clave reales al repositorio.
# Para Gmail se recomienda usar una "contraseña de aplicación" (App Password), no la clave normal de la cuenta.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

app.mail.from=${MAIL_FROM:no-reply@turnoya.com}

# Thymeleaf: los templates de correo son estáticos (no dependen de request HTTP), evitamos el cache
# en desarrollo para poder iterar el HTML sin reiniciar la app.
spring.thymeleaf.cache=false
