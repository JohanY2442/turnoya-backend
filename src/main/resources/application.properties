spring.application.name=turnoya-backend

# --- Correo (EmailService) ---
# Configura estas variables de entorno en tu máquina/IntelliJ (Run Configuration > Environment variables),
# NUNCA subas usuario/clave reales al repositorio.
# Para Gmail se recomienda usar una "contraseña de aplicación" (App Password), no la clave normal de la cuenta.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

app.mail.from=${MAIL_FROM:no-reply@turnoya.com}

# Thymeleaf: los templates de correo son estáticos (no dependen de request HTTP), evitamos el cache
# en desarrollo para poder iterar el HTML sin reiniciar la app.
spring.thymeleaf.cache=false
